<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant Booking</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css" />
  <style>
    body{font-family:Arial;background:#fff7f1}
    .hero{
      background:url('restaurant-bg.jpg') center/cover no-repeat;
      min-height:300px;
      color:#fff;
      display:flex;
      align-items:center;
      box-shadow:inset 0 0 0 1000px rgba(0,0,0,.35);
    }
    .card,.form-control,.form-select{border-radius:12px}
    .btn{border-radius:12px}
    .carousel-item img{height:260px;object-fit:cover}
    .alert{display:none}
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container"><span class="navbar-brand mb-0 h1">Restaurant</span></div>
  </nav>

  <div class="hero d-flex align-items-center">
    <div class="container">
      <h1>Book Your Table</h1>
      <p>Enjoy delicious food in a cozy atmosphere.</p>
    </div>
  </div>

  <div class="container py-4">
    <h3 class="text-center">Gallery</h3>
    <div id="gallery" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active"><img src="https://images.unsplash.com/photo-1559339352-11d035aa65de?auto=format&fit=crop&w=1200&q=80" class="d-block w-100" alt=""></div>
        <div class="carousel-item"><img src="https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=1200&q=80" class="d-block w-100" alt=""></div>
        <div class="carousel-item"><img src="https://images.unsplash.com/photo-1528605248644-14dd04022da1?auto=format&fit=crop&w=1200&q=80" class="d-block w-100" alt=""></div>
      </div>
    </div>

    <div class="mt-4 card p-3">
      <h4>Booking</h4>
      <form id="form">
        <input class="form-control mb-2" id="name" placeholder="Name" required>
        <input class="form-control mb-2" id="phone" placeholder="Phone" required>
        <input type="date" class="form-control mb-2" id="date" required>
        <select class="form-select mb-2" id="time" required>
          <option value="">Time</option>
          <option>12:00</option>
          <option>6:00</option>
          <option>8:00</option>
        </select>
        <select class="form-select mb-2" id="guests" required>
          <option value="">Guests</option>
          <option>2</option>
          <option>4</option>
          <option>6</option>
        </select>
        <button class="btn btn-dark w-100">Book Now</button>
      </form>
      <div class="alert alert-success mt-3" id="msg">Booking Added!</div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.12.4.min.js"></script>
  <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    $('#form').on('submit', function(e){
      e.preventDefault();
      $('#msg').show();
      this.reset();
    });
  </script>
</body>
</html>
